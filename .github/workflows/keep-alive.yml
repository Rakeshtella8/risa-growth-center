# Supabase free projects pause after 7 days without activity. One tiny read a day keeps the demo awake.
name: keep-supabase-awake
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row through the public API
        run: |
          curl -fsS "https://twpnytzfgaaztfxbujjl.supabase.co/rest/v1/campaigns?select=campaign_id&limit=1" \
            -H "apikey: sb_publishable_iBzEMZ271LzREvfwfw9H8Q_MW4o78ur"
